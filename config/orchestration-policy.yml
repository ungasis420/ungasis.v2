# Analogy: The orchestration policy is like the master conductor of an orchestra.
# - Just as the conductor makes sure the violins, flutes, and drums play at the right speed,
#   in harmony, and follow the sheet music, this policy coordinates the circuit breaker,
#   token budget, progress detection, and scoring configurations to keep the system in sync.

orchestration_policy:
  # max_agents_parallel: The maximum number of agents allowed to work at the same time.
  max_agents_parallel: 3

  # max_chain_length: The maximum steps in a sequence before stopping.
  max_chain_length: 7

  # timeout_per_agent_minutes: The maximum run time for a single agent role before timing out.
  timeout_per_agent_minutes: 15

  # total_chain_timeout_minutes: The maximum total run time for the entire assembly line.
  total_chain_timeout_minutes: 60

  # failure_handling: References config/circuit-breaker.yml for handling agent errors.
  failure_handling: circuit_breaker

  # token_tracking: References config/token-budget.yml to track token usage.
  token_tracking: token_budget

  # progress_monitoring: References config/progress-detection.yml to prevent loop cycles.
  progress_monitoring: progress_detection

  # scoring: References config/agent-scoring.yml to evaluate output quality.
  scoring: agent_scoring

  # human_gate_required: Forces human approval before final code is merged.
  human_gate_required: true

  # auto_rollback_on_F_grade: Reverts the change automatically if the agent gets an F score.
  auto_rollback_on_F_grade: true

  # log_file: Path to log all sessions and results.
  log_file: docs/AGENT_RUN_LOG.md


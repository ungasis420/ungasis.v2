name: UNGASIS CI

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pytest
        run: pip install pytest

      - name: Run pytest
        run: python -m pytest scripts/test_ungasis.py -v

      - name: Run ungasis pulse
        run: python scripts/ungasis.py pulse

      - name: Run wiki-lint
        run: python scripts/wiki-lint.py --json

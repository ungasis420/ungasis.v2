name: UNGASIS Daily Pulse
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run daily pulse
        run: python scripts/ungasis.py pulse
      - name: Run warn check
        run: python scripts/ungasis.py warn
      - name: Report generated pulse outputs
        run: |
          echo "Daily pulse generated. Latest-state files are not committed to main."
          git status --short

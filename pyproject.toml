[project]
name = "ungasis"
version = "5.0.0"
description = "UNGASIS OS v5.0 JARVIS-Fabricator"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (we use 120)
    "B008",  # function call in default arg
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

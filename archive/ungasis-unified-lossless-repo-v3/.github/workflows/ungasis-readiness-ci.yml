name: UNGASIS Readiness Check

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        # Production note: ask a technical helper to pin this action to a full commit SHA.

      - name: Run simple readiness check
        run: python scripts/check_readiness.py
